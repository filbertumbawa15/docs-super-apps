name: Build APK (mobile demo)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder platform Android
        run: |
          flutter create --platforms=android --org id.polri.demo --project-name super_apps_polri_demo .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Super Apps Polri (Demo)"/' android/app/src/main/AndroidManifest.xml
          # Izin internet + izinkan http:// (API admin-be memakai http)
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Ikon aplikasi dari logo Polri
        run: dart run flutter_launcher_icons

      - name: Analyze (gagal hanya bila ada error)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: super-apps-polri-demo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        run: |
          flutter create --platforms=web --org id.polri.demo --project-name super_apps_polri_demo .
          rm -rf test
          flutter pub get
          flutter build web --release
      - name: Tangkapan layar (390x844 @3x)
        run: |
          (cd build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const s of ['dashboard', 'layanan', 'vc']) {
              const p = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3 });
              await p.goto('http://127.0.0.1:8080/?start=' + s, { waitUntil: 'networkidle' });
              await p.waitForTimeout(8000);
              await p.screenshot({ path: s + '.png' });
              await p.close();
            }
            await b.close();
          })();
          JS
          node shot.js
          for s in dashboard layanan vc; do
            echo "-----BEGIN ${s} PNG-----"
            base64 -w 76 $s.png
            echo "-----END ${s} PNG-----"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: |
            mobile/dashboard.png
            mobile/layanan.png
            mobile/vc.png
