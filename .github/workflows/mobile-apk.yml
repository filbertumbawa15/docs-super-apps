name: Build APK (mobile demo)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder platform Android
        run: |
          flutter create --platforms=android --org id.polri.demo --project-name super_apps_polri_demo .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Super Apps Polri (Demo)"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze (gagal hanya bila ada error)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: super-apps-polri-demo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web (langsung ke dashboard)
        run: |
          flutter create --platforms=web --org id.polri.demo --project-name super_apps_polri_demo .
          rm -rf test
          flutter pub get
          flutter build web --release --dart-define=START=dashboard
      - name: Tangkapan layar dashboard (390x844 @3x)
        run: |
          (cd build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3 });
            await p.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(8000);
            await p.screenshot({ path: 'dashboard.png' });
            await b.close();
          })();
          JS
          node shot.js
          echo "-----BEGIN DASHBOARD PNG-----"
          base64 -w 76 dashboard.png
          echo "-----END DASHBOARD PNG-----"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: mobile/dashboard.png
