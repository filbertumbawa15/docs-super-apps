name: super_apps_polri_demo
description: Demo aplikasi Super Apps Polri - onboarding sampai dompet Verifiable Credential (SKCK).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/discovery/
    - assets/profile/

# Ikon aplikasi dari logo Polri: jalankan `dart run flutter_launcher_icons` setelah `flutter create`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#101320"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"

# Native splash (sebelum Flutter tampil) berwarna sama dengan layar pertama, tanpa kedip putih.
# Jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#131625"
  android: true
  ios: false
  web: false
  android_12:
    color: "#131625"
